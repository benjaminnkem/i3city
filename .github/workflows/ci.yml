name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: i3city_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d i3city_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/i3city_ci
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-password
      WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, type-check and build
        run: pnpm turbo run lint check-types build

      - name: Migrate and seed the database
        run: |
          pnpm --filter api db:deploy
          pnpm --filter api db:seed

      - name: Unit tests
        run: pnpm turbo run test

      - name: API end-to-end tests
        run: pnpm --filter api test:e2e
